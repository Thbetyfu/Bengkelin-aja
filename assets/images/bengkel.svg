<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img">
  <title>Ilustrasi gedung bengkel motor</title>
  <rect x="0" y="0" width="320" height="200" rx="12" fill="#eff6ff"/>
  <rect x="0" y="170" width="320" height="30" fill="#9ca3af"/>
  <!-- gedung -->
  <path d="M40 80 L160 30 L280 80 Z" fill="#1d4ed8"/>
  <rect x="50" y="80" width="220" height="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <!-- papan nama -->
  <rect x="110" y="86" width="100" height="22" rx="4" fill="#1f2937"/>
  <text x="160" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">BENGKEL</text>
  <!-- pintu garasi -->
  <rect x="70" y="116" width="100" height="54" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <line x1="70" y1="128" x2="170" y2="128" stroke="#9ca3af" stroke-width="2"/>
  <line x1="70" y1="140" x2="170" y2="140" stroke="#9ca3af" stroke-width="2"/>
  <line x1="70" y1="152" x2="170" y2="152" stroke="#9ca3af" stroke-width="2"/>
  <!-- jendela -->
  <rect x="190" y="118" width="60" height="34" fill="#bfdbfe" stroke="#4b5563" stroke-width="2"/>
  <line x1="220" y1="118" x2="220" y2="152" stroke="#4b5563" stroke-width="2"/>
  <!-- ikon kunci pas -->
  <circle cx="160" cy="58" r="12" fill="#ffffff"/>
  <path d="M152 66 L168 50" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="168" cy="50" r="4" fill="#1d4ed8"/>
</svg>
